name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    paths:
      - assets/**
      - Dockerfile
      - .dockerignore
      - src/**
      - Cargo.toml
      - Cargo.lock
      - .cargo/**
      - .github/workflows/main.yml
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/mitasul/miora

jobs:
  build-and-push:
    name: Build & Push ghcr.io/mitasul/miora
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
          tags: |
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=miora-linux-amd64
          cache-to: type=gha,mode=max,scope=miora-linux-amd64,ignore-error=true
