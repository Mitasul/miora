<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="same-origin">
  <title>概览 · Miora 管理控制台</title>
  <link rel="icon" type="image/svg+xml" href="/admin/assets/favicon.svg">
  <script src="/admin/assets/theme.js"></script>
  <link rel="stylesheet" href="/admin/assets/styles.css">
  <script type="module" src="/admin/assets/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">跳至主要内容</a>
  <div class="app-shell">
    <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>
    <aside class="sidebar" id="sidebar" aria-label="控制台侧栏">
      <a class="brand" href="#overview" aria-label="Miora 概览"><img class="brand-mark" src="/admin/assets/favicon.svg" width="40" height="40" alt=""><span>miora</span></a>
      <nav id="primary-nav" aria-label="主导航">
        <a href="#overview" data-route="overview"><span data-icon="grid"></span><span>概览</span></a>
        <a href="#channels" data-route="channels"><span data-icon="channels"></span><span>渠道与模型</span></a>
        <a href="#plugins" data-route="plugins"><span data-icon="plugin"></span><span>插件管理</span></a>
        <a href="#interceptors" data-route="interceptors"><span data-icon="filter"></span><span>请求拦截器</span></a>
        <a href="#keys" data-route="keys"><span data-icon="key"></span><span>API Key</span></a>
        <a href="#testing" data-route="testing"><span data-icon="pulse"></span><span>模型测试</span></a>
        <a href="#playground" data-route="playground"><span data-icon="code"></span><span>对话调试台</span></a>
        <a href="#workspace" data-route="workspace"><span data-icon="box"></span><span>工作区</span></a>
        <a href="#logs" data-route="logs"><span data-icon="file"></span><span>请求日志</span></a>
        <a href="#backend-logs" data-route="backend-logs"><span data-icon="code"></span><span>后台日志</span></a>
        <span class="nav-divider"></span>
        <a href="#settings" data-route="settings"><span data-icon="settings"></span><span>系统设置</span></a>
      </nav>
      <div class="sidebar-bottom">
        <div class="account">
          <span class="avatar" data-icon="user"></span>
          <span class="account-info"><strong id="account-name">管理员</strong></span>
          <button class="icon-button" id="logout" type="button" aria-label="退出登录" title="退出登录"><span data-icon="logout"></span></button>
        </div>
      </div>
    </aside>
    <div class="main-shell">
      <header class="topbar">
        <div class="breadcrumb">
          <button class="icon-button mobile-menu" id="menu-toggle" type="button" aria-label="打开导航" aria-controls="sidebar" aria-expanded="false"><span data-icon="menu"></span></button>
          <span>工作空间</span>
          <span data-icon="chevron"></span>
          <strong id="breadcrumb-current">概览</strong>
        </div>
        <div class="topbar-tools"><button class="button small" id="check-update" type="button" title="检查与拉取最新版本"><span data-icon="upload"></span><span>检查更新</span></button><button class="icon-button theme-toggle" type="button" data-theme-toggle aria-label="外观：跟随系统" title="外观：跟随系统"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M12 3v18a9 9 0 0 0 0-18Z" fill="currentColor"/></svg></button><div class="session-state"><span data-icon="lock"></span><span id="session-state">正在验证会话</span></div></div>
      </header>
      <main id="main-content" tabindex="-1"><div class="loading-state" role="status"><span class="spinner"></span><p>正在连接管理服务…</p></div></main>
    </div>
  </div>
  <dialog id="editor-dialog" class="editor-dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <div class="toast-region" id="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>
  <noscript><p class="noscript">管理控制台需要启用 JavaScript。</p></noscript>
</body>
</html>
